
name: Kubota Radar

'on':
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: kubota-radar-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Kubota advertenties controleren
        run: python kubota_monitor.py

      - name: Resultaten opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json feed.xml
          git diff --cached --quiet || git commit -m "Update Kubota Radar"
          git pull --rebase origin main
          git push
